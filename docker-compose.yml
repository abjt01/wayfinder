services:
  wayfinder:
    build:
      context: .
      dockerfile: Dockerfile
    image: wayfinder:latest
    container_name: wayfinder
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # Optional. Without a key the app runs on its deterministic local engine,
      # so the container is fully functional either way.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      # Comma-separated pool; requests round-robin across it and a rate-limited
      # key sits out its cooldown. Merged with GROQ_API_KEY above.
      GROQ_API_KEYS: ${GROQ_API_KEYS:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 8s
